name: Automatic desktop release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test release safety and recovery
        run: |
          python3 -m pip install pynacl==1.6.2
          python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Verify app updater
        run: |
          npm install --global pnpm@10.12.3 --force
          pnpm install --frozen-lockfile
          pnpm exec vitest run tests/lib/updater.test.ts tests/contexts/UpdateContext.test.tsx
          pnpm run typecheck

  build:
    needs: verify
    if: github.repository == 'SSYCloud/ssy-switch' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/signed-desktop-builds.yml
    with:
      notarize: true
      build_windows: true
      automatic_release: true
    secrets: inherit

  publish:
    needs: build
    runs-on: macos-14
    environment: release
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    concurrency:
      group: desktop-release-publish
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Install updater signing tools
        run: |
          npm install --global @tauri-apps/cli@2.8.1
          python3 -m venv "$RUNNER_TEMP/updater-tools"
          "$RUNNER_TEMP/updater-tools/bin/pip" install pynacl==1.6.2
      - name: Publish verified installers or preserve a pending draft
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: '"$RUNNER_TEMP/updater-tools/bin/python" .github/scripts/desktop_release.py --run-id "$SOURCE_RUN_ID"'
