[package]
name = "ssy-core"
version = "0.1.0"
edition = "2021"
description = "Shengsuanyun open-platform core SDK: OAuth (Authorization Code + loopback), account/credential contracts, wallet & usage data clients"
license = "MIT"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.11", features = ["v4"] }
url = "2.5"
chrono = "0.4"
log = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
axum = { version = "0.7", optional = true }
futures = { version = "0.3", optional = true }

[features]
default = ["callback-server"]
callback-server = ["dep:axum", "dep:futures"]

[dev-dependencies]
