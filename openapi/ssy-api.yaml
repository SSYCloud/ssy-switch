openapi: 3.1.0
info:
  title: Shengsuanyun Open Platform API
  version: 0.1.0
  description: |
    胜算云开放平台 REST 契约 —— SSY SDK（Rust/TS/Go…）的唯一事实源。

    ## 服务器
    - `api.shengsuanyun.com`：账户/钱包/模型调用数据
    - `loomloom.shengsuanyun.com`：Loom 市场（余额、创作者、SkillBot）

    ## 认证（双凭据体系，按端点选择）
    - `XTokenJwt`：`x-token: <jwt>` —— OAuth 登录凭据，用于**账户/数据类**端点
      （/user/info、/modelrouter/*、/userorder/*）。网关 API Key 会被拒绝
      （code 20003 / 20001）。
    - `BearerKey`：`Authorization: Bearer <api_key>` —— **模型网关**凭据，
      用于 loom balance 与模型调用本身。

    ## 响应封装与单位
    - 除 loom balance 外，所有响应为 `{ code, data, msg }` 封装；`code = 0` 成功，
      非 0 业务失败（消息在 `msg`）。
    - 金额单位两套，严格按 schema 标注使用：
      - `AmountT1e4`：1e-4 元（10,000 = 1 元）—— 钱包 Assets/账单
      - `AmountT1e7`：1e-7 元（10,000,000 = 1 元）—— loom 余额/调用消费
    - 字段名大小写历史上不稳定（`ID|id`、`Wallet|wallet`），SDK 实现需做兜底；
      本规范以实测主形态为准。

    ## OAuth 授权（非 REST，浏览器流程）
    1. 浏览器打开 `GET https://router.shengsuanyun.com/auth?callback_url=<loopback>&state=<uuid>`
    2. 授权后上游 302 回 `callback_url?code=<code>&state=<state>`
    3. 客户端调 `POST /auth/keys` 换取 `api_key` + `jwt_token`
    4. `state`：UUID v4、5 分钟 TTL、一次性（SDK 强制）
servers:
  - url: https://router.shengsuanyun.com
    description: 模型网关（推理调用 / 模型目录）
  - url: https://api.shengsuanyun.com
    description: 账户 / 钱包 / 模型调用数据
  - url: https://loomloom.shengsuanyun.com
    description: Loom 市场（余额 / 创作者）

security:
  - XTokenJwt: []

paths:
  /api/v1/models:
    get:
      operationId: listModels
      summary: 模型目录
      description: |
        返回平台全部可用模型。**模型 id 以 `api_name` 字段为准**（小写形态），
        推理请求的 `model` 参数必须使用它；`name` 字段是展示名（大小写不同），
        直接用 `name` 会被网关拒绝（"model is not available"）。
      security:
        - BearerKey: []
      servers:
        - url: https://router.shengsuanyun.com
      responses:
        "200":
          description: 模型目录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelCatalog"

  /api/v1/messages:
    post:
      operationId: createAnthropicMessage
      summary: Anthropic Messages 兼容推理
      description: |
        Anthropic Messages API 兼容端点（含 SSE 流式：请求 `stream: true` 时返回
        `text/event-stream`）。模型会按平台路由到实际通道（Bedrock / Azure / …），
        响应中的 `model` 字段是**上游通道的内部模型名**，不是请求的模型 id。
      security:
        - BearerKey: []
      servers:
        - url: https://router.shengsuanyun.com
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnthropicMessageRequest"
      responses:
        "200":
          description: 推理结果（非流式）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicMessageResponse"
            text/event-stream:
              schema:
                type: string
                description: SSE 流式事件（message_start / content_block_delta / message_stop）

  /api/v1/chat/completions:
    post:
      operationId: createChatCompletion
      summary: OpenAI Chat Completions 兼容推理
      description: |
        OpenAI 兼容端点（支持 SSE 流式）。**`model` 必须用模型目录中的
        `api_name`（小写）**，用展示名会返回 invalid_request "model is not available"。
        部分推理模型会在 `message.reasoning_content` / `reasoning` 中返回思考内容。
      security:
        - BearerKey: []
      servers:
        - url: https://router.shengsuanyun.com
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCompletionRequest"
      responses:
        "200":
          description: 推理结果（非流式）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatCompletionResponse"
            text/event-stream:
              schema:
                type: string
                description: SSE 流式 chunk

  /api/v1/balance:
    get:
      operationId: getGatewayBalance
      summary: 网关余额（按 API Key 查询，官方文档化端点）
      description: |
        查询当前 API Key 对应的普通账户余额或企业项目预算，系统按 Key 类型
        自动返回对应结构（`gateway_type` 区分）。金额字段**已为元**，无需换算。
        只需 Bearer API Key——手动配置 Key 的用户（未走 OAuth）也可查询。
      security:
        - BearerKey: []
      servers:
        - url: https://router.shengsuanyun.com
      responses:
        "200":
          description: 余额（结构随 gateway_type 不同）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayBalance"

  /user/recharge:
    post:
      operationId: createRechargeOrder
      summary: 创建充值订单（返回收款二维码链接）
      description: |
        **两种互斥模式**（2026-09-18 实测）：
        - `recahrgeId: null` + `amounts`（1e-4 元）= 自定义金额；
          **最低 ¥30**（amounts ≥ 300000，低于报 `code: 70002`）
        - `recahrgeId: <套餐id>`（如 22）= **定额套餐**，服务端忽略 `amounts`
          （22 档固定 ¥10，传任意 amounts 均 Price=100000）

        `orderId` 为客户端生成的 16 位 hex；服务端可能改写，**支付状态查询
        （/user/payQuery）以响应中的 `payOrder.OrderID` 为准**。
        `Status: 0` 为未支付；响应 `url` 为收款码链接（渲染二维码即可收款）。
        未支付订单自动过期，不扣款。
      security:
        - XTokenJwt: []
      servers:
        - url: https://api.shengsuanyun.com
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amounts, payWay, orderId]
              properties:
                amounts:
                  $ref: "#/components/schemas/AmountT1e4"
                  description: 充值金额；recahrgeId 非空时被服务端忽略
                payWay:
                  type: string
                  enum: [alipay]
                  description: 支付渠道（实测 alipay；微信渠道待确认）
                recahrgeId:
                  type: integer
                  nullable: true
                  description: 定额套餐 id（null = 自定义金额）；22 档实测固定 ¥10
                orderId:
                  type: string
                  description: 客户端生成的订单标识（16 位 hex）
      responses:
        "200":
          description: 下单结果（可能仍是业务失败，以 code 区分）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BusinessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RechargeOrderData"

  /user/payQuery:
    post:
      operationId: queryRechargeStatus
      summary: 查询充值订单支付状态
      description: |
        `msg` 承载状态语义：未支付返回 `unpaid`；支付成功返回其他值
        （具体成功文案待实测确认）。`orderId` 使用下单响应中的
        `payOrder.OrderID`。
      security:
        - XTokenJwt: []
      servers:
        - url: https://api.shengsuanyun.com
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId]
              properties:
                orderId:
                  type: string
      responses:
        "200":
          description: 支付状态
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BusinessEnvelope"
                  - type: object
                    properties:
                      msg:
                        type: string
                        description: "unpaid = 未支付；其他值 = 终态（成功文案待实测）"

  /auth/keys:
    post:
      operationId: exchangeCode
      summary: OAuth code 换 API Key + JWT
      description: |
        Authorization Code 换取双凭据。`code` 一次性、短 TTL。
        响应层级历史上不稳定，SDK 按以下顺序兜底取值：
        `data.data.api_key` → `data.api_key` → `api_key`；
        `jwt_token` 同理，且 `api_key` 缺失时以 `jwt_token` 兜底。
        `code != 0` 视为业务失败。
      security: []
      servers:
        - url: https://api.shengsuanyun.com
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, callback_url]
              properties:
                code:
                  type: string
                  description: OAuth 授权码（一次性）
                callback_url:
                  type: string
                  format: uri
                  description: 必须与授权时 callback_url 完全一致
      responses:
        "200":
          description: 换取成功或业务失败（以 code 区分）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BusinessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ApiKeyExchangeData"
        "4XX":
          description: HTTP 层失败（msg 含上游错误信息）

  /user/info:
    get:
      operationId: getUserInfo
      summary: 当前用户信息与钱包（余额 / 体验券）
      description: '必须 `x-token: <jwt_token>`；网关 Key 返回 code 20003。'
      servers:
        - url: https://api.shengsuanyun.com
      responses:
        "200":
          description: 用户信息
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BusinessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/UserInfo"

  /modelrouter/userusage:
    get:
      operationId: getModelUsageDaily
      summary: 大模型调用统计（按日 × 按模型）
      servers:
        - url: https://api.shengsuanyun.com
      parameters:
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
      responses:
        "200":
          description: 按日聚合的调用用量
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BusinessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/UsageDailyData"

  /modelrouter/modalities/userusage:
    get:
      operationId: getModalityUsage
      summary: 多模态调用统计（图片 / 视频）
      description: |
        只覆盖多模态模型（如 Doubao Seedance、GPT Image）。
        注意：参数名为 `startDate`/`endDate`；用 `start_time` 会返回空。
      servers:
        - url: https://api.shengsuanyun.com
      parameters:
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
      responses:
        "200":
          description: 多模态按日用量
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BusinessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ModalityUsageData"

  /modelrouter/userlog:
    get:
      operationId: listCallLogs
      summary: 单次调用流水（分页）
      description: 逐笔请求级日志，含延迟与实际上游通道（provider）。
      servers:
        - url: https://api.shengsuanyun.com
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
      responses:
        "200":
          description: 调用日志
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BusinessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CallLogData"

  /token/list:
    get:
      operationId: listAccountTokens
      summary: 账号下多 Key 列表
      description: |
        必须用 jwt_token（api_key 返回 code 20003）。
        - `data` 直接是数组（兼容层保留 data.list / data.items / data.data 兜底）
        - `MaxQuota` / `ConsumedAmount` 单位 1e-4 元；**`MaxQuota == 0` 表示无上限**
          （不是额度为 0；不可用 `!= 0` 判断字段存在）
        - `Token` 字段是**完整明文 Key**：SDK 只在用户显式选择时按需读取，
          列表接口只回脱敏元数据——不落库、不写日志、不整表下发前端
        - `SupportedModels` 是 JSON 字符串（也可能是数组），解析失败按空集合处理
      servers:
        - url: https://api.shengsuanyun.com
      responses:
        "200":
          description: Key 列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BusinessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        description: 实测 data 直接为数组
                        items:
                          $ref: "#/components/schemas/AccountToken"

  /userorder/billlist:
    post:
      operationId: listBills
      summary: 充值 / 账单流水（分页）
      description: |
        **只接受 POST**（GET 返回 404）。Asset/Balance 单位 1e-4 元。
        BillType = `recharge` 表示充值；`BillSubType` 标识支付渠道
        （如 `wechat_pay_recharge`）。
      servers:
        - url: https://api.shengsuanyun.com
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                page:
                  type: integer
                  minimum: 1
                  default: 1
                page_size:
                  type: integer
                  minimum: 1
                  maximum: 50
                  default: 10
      responses:
        "200":
          description: 账单流水
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BusinessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/BillListData"

  /loom/v1/users/me/balance:
    get:
      operationId: getLoomBalance
      summary: Loom 侧可用余额
      description: |
        官方推荐的连通性自检端点。`availableBalanceT` 单位 1e-7 元
        （10,000,000 = 1 元）；`availableBalance.amount` 为字符串形式的元。
        接受 Bearer API Key 或 x-token JWT。
      security:
        - BearerKey: []
        - XTokenJwt: []
      servers:
        - url: https://loomloom.shengsuanyun.com
      responses:
        "200":
          description: 余额
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoomBalance"

  /loom/v1/creators/me/marketListings:
    get:
      operationId: listCreatorMarketListings
      summary: 创作者市场 listings（创作者角色探测）
      description: |
        普通用户也可 200 + 空 `items`；仅当 `items` 非空才视为创作者，
        不能以 HTTP 状态码单独判定。实测 `x-token: <api_key>` 亦可调用。
      servers:
        - url: https://loomloom.shengsuanyun.com
      parameters:
        - name: pageSize
          in: query
          schema: { type: integer, default: 100 }
      responses:
        "200":
          description: listings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketListings"
components:
  securitySchemes:
    XTokenJwt:
      type: apiKey
      in: header
      name: x-token
      description: OAuth 登录凭据（jwt_token）
    BearerKey:
      type: http
      scheme: bearer
      description: 模型网关 API Key（api_key）

  parameters:
    StartDate:
      name: startDate
      in: query
      required: true
      schema: { type: string, format: date, examples: ["2026-09-11"] }
    EndDate:
      name: endDate
      in: query
      required: true
      schema: { type: string, format: date, examples: ["2026-09-18"] }

  schemas:
    BusinessEnvelope:
      type: object
      required: [code]
      properties:
        code:
          type: integer
          description: "0 = 成功；非 0 = 业务失败（如 20003 凭据无效）"
        msg:
          type: string
        data:
          description: 业务数据（结构随端点不同）

    AmountT1e4:
      type: integer
      format: int64
      description: 金额，单位 1e-4 元（10,000 = 1 元）

    AmountT1e7:
      type: number
      description: 金额，单位 1e-7 元（10,000,000 = 1 元）；实测可能为整数或字符串

    ApiKeyExchangeData:
      type: object
      description: 双层 data 包裹，字段按 api_key / jwt_token 兜底提取
      properties:
        api_key:
          type: string
          description: 模型网关 Key（Bearer）
        jwt_token:
          type: string
          description: 用户身份 JWT（x-token，用于账户类端点）
        expires_in:
          type: number
          description: JWT 有效期（秒）；实测单次取样 ≈593400s ≈ 6.9 天，续期路径未验证

    Wallet:
      type: object
      properties:
        Assets:
          $ref: "#/components/schemas/AmountT1e4"
        VoucherBalance:
          $ref: "#/components/schemas/AmountT1e4"
        Accumulate:
          $ref: "#/components/schemas/AmountT1e4"
        TotalRechargeAmount:
          $ref: "#/components/schemas/AmountT1e4"

    UserInfo:
      type: object
      description: 字段大小写历史不稳定（ID|id、Nickname|nickname），SDK 需兜底
      properties:
        ID:
          type: string
          description: 用户唯一标识（可能为空——上游缺陷，SDK 需容忍）
        Username:
          type: string
        Nickname:
          type: string
        Email:
          type: string
        HeadImg:
          type: string
        Wallet:
          $ref: "#/components/schemas/Wallet"

    UsageDetail:
      type: object
      required: [model, total_amount, total_tokens]
      properties:
        model:
          type: string
          examples: ["bigmodel/GLM-5.3-Flash"]
        total_amount:
          $ref: "#/components/schemas/AmountT1e7"
        input_tokens: { type: integer, format: int64 }
        output_tokens: { type: integer, format: int64 }
        total_tokens: { type: integer, format: int64 }

    UsageDailyData:
      type: object
      properties:
        usages:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date-time
              details:
                type: array
                items:
                  $ref: "#/components/schemas/UsageDetail"

    ModalityUsageData:
      type: object
      properties:
        total:
          type: integer
        usages:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date-time
              details:
                type: array
                items:
                  type: object
                  properties:
                    model: { type: string }
                    total_amount:
                      $ref: "#/components/schemas/AmountT1e7"

    CallLogEntry:
      type: object
      properties:
        request_id:
          type: string
        request_time:
          type: string
          format: date-time
        model:
          type: object
          properties:
            id: { type: integer }
            company: { type: string }
            name: { type: string }
        input_tokens: { type: integer, format: int64 }
        output_tokens: { type: integer, format: int64 }
        total_amount:
          $ref: "#/components/schemas/AmountT1e7"
        cached_discount:
          $ref: "#/components/schemas/AmountT1e7"
        throughput: { type: integer }
        latency: { type: integer, description: 毫秒 }
        provider:
          type: string
          description: 实际上游通道（Amazon Bedrock / Azure / …）
        request_ip: { type: string }
        router_app: { type: string, nullable: true }

    CallLogData:
      type: object
      properties:
        logs:
          type: array
          items:
            $ref: "#/components/schemas/CallLogEntry"

    Bill:
      type: object
      properties:
        ID: { type: integer }
        CreatedAt: { type: string, format: date-time }
        Asset:
          $ref: "#/components/schemas/AmountT1e4"
        Balance:
          $ref: "#/components/schemas/AmountT1e4"
          description: 本笔变动后的余额快照
        BalanceStatementType:
          type: string
          examples: ["收入"]
        BillType:
          type: string
          examples: ["recharge"]
        BillSubType:
          type: string
          examples: ["wechat_pay_recharge"]
        PaymentOrderID: { type: integer }

    BillListData:
      type: object
      properties:
        bills:
          type: array
          items:
            $ref: "#/components/schemas/Bill"

    AccountToken:
      type: object
      description: |
        数字与字符串混用，全部柔性解析。`MaxQuota == 0` 表示无上限。
        `Token` 为完整明文 Key —— 仅在用户显式选择时按需读取，禁止落库/写日志/下发列表。
      properties:
        ID: { type: integer }
        Name: { type: string }
        Desc: { type: string, nullable: true }
        IsDefault: { type: boolean }
        IsBanned: { type: boolean }
        IsExpired: { type: boolean }
        MaxQuota:
          $ref: "#/components/schemas/AmountT1e4"
        ConsumedAmount:
          $ref: "#/components/schemas/AmountT1e4"
        CreatedAt: { type: string }
        ExpiresAt: { type: string, nullable: true }
        SupportedModels:
          type: string
          description: JSON 字符串（也可能是数组），解析失败按空集合处理
        Token:
          type: string
          writeOnly: true
          description: 完整明文 Key（见安全说明；列表接口不回传）

    LoomBalance:
      type: object
      properties:
        currency:
          type: string
          examples: ["CNY"]
        availableBalanceT:
          $ref: "#/components/schemas/AmountT1e7"
        availableBalance:
          type: object
          properties:
            amount:
              type: string
              description: 十进制字符串形式的元
            currency:
              type: string

    MarketListings:
      type: object
      properties:
        items:
          type: array
          items: { type: object }
        totalCount:
          type: integer
  GatewayBalance:
    type: object
    required: [success, data]
    properties:
      success:
        type: boolean
      data:
        type: object
        required: [gateway_type, account_balance_cny]
        properties:
          gateway_type:
            type: string
            enum: [common, enterprise]
            description: 普通网关 / 企业网关（企业结构字段不同）
          account_balance_cny:
            type: number
            description: 账户总余额（元），不含业务专属代金券与授信额度
          voucher_balance_cny:
            type: number
            description: 通用代金券余额（元）
          gateway_voucher_balance_cny:
            type: number
            description: Gateway 专属代金券余额（元）
          cash_balance_cny:
            type: number
            description: 充值形成的人民币余额（元）
          locked_balance_cny:
            type: number
            description: 尚未最终扣除的待扣/预扣金额（元）
          credit_limit_cny:
            type: number
            description: 授信额度（元）

  RechargeOrderData:
    type: object
    properties:
      url:
        type: string
        description: 收款码链接（如 https://qr.alipay.com/...，渲染二维码即可收款）
      payOrder:
        type: object
        properties:
          ID: { type: integer }
          OrderID:
            type: string
            description: 服务端订单标识（payQuery 用它，不是客户端生成的 orderId）
          Price:
            $ref: "#/components/schemas/AmountT1e4"
          Amount:
            $ref: "#/components/schemas/AmountT1e4"
          GiftAmount:
            $ref: "#/components/schemas/AmountT1e4"
          RechargeID: { type: integer, nullable: true }
          PayMethod: { type: string }
          Status:
            type: integer
            description: 0 = 未支付
          Err: { type: string }

  ModelCatalog:
    type: object
    required: [data]
    properties:
      data:
        type: array
        items:
          type: object
          properties:
            company:
              type: string
              examples: ["bigmodel", "Anthropic"]
            name:
              type: string
              description: 展示名（大小写与调用 id 不同）
            api_name:
              type: string
              description: '**推理请求 model 参数使用的正式 id**（小写形态）'
            description:
              type: string

  AnthropicMessageRequest:
    type: object
    required: [model, max_tokens, messages]
    properties:
      model:
        type: string
        examples: ["anthropic/claude-haiku-4.5"]
      max_tokens:
        type: integer
      stream:
        type: boolean
      system:
        type: string
      messages:
        type: array
        items:
          type: object
          required: [role, content]
          properties:
            role: { type: string, enum: [user, assistant] }
            content:
              description: 字符串或内容块数组（Anthropic 格式）

  AnthropicMessageResponse:
    type: object
    properties:
      id:
        type: string
        description: 上游通道内部 id（如 msg_bdrk_…）
      type:
        type: string
        examples: ["message"]
      role:
        type: string
      model:
        type: string
        description: 上游通道内部模型名（非请求 id）
      content:
        type: array
        items:
          type: object
          properties:
            type: { type: string }
            text: { type: string }
      stop_reason:
        type: string
        nullable: true
      usage:
        type: object
        properties:
          input_tokens: { type: integer }
          output_tokens: { type: integer }
          cache_read_input_tokens: { type: integer }

  ChatCompletionRequest:
    type: object
    required: [model, messages]
    properties:
      model:
        type: string
        description: 模型目录中的 api_name（小写）
      stream:
        type: boolean
      max_tokens: { type: integer }
      messages:
        type: array
        items:
          type: object
          required: [role, content]
          properties:
            role: { type: string, enum: [system, user, assistant] }
            content: {}

  ChatCompletionResponse:
    type: object
    properties:
      id: { type: string }
      object:
        type: string
        examples: ["chat.completion"]
      created: { type: integer }
      model: { type: string }
      provider:
        type: string
        description: 实际上游通道（如 Other-A / Azure）
      choices:
        type: array
        items:
          type: object
          properties:
            index: { type: integer }
            finish_reason: { type: string, nullable: true }
            message:
              type: object
              properties:
                role: { type: string }
                content:
                  type: string
                  nullable: true
                reasoning_content:
                  type: string
                  nullable: true
                  description: 推理模型的思考内容
      usage:
        type: object
        properties:
          prompt_tokens: { type: integer }
          completion_tokens: { type: integer }
          total_tokens: { type: integer }
